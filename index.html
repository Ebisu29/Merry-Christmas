<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Christmas Wonderland 🎄</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="scene" id="scene">

    <div class="aurora"></div>

    <div class="moon"></div>

    <div class="stars" id="stars"></div>

    <div class="shooting-star"></div>

    <!-- TOP CHRISTMAS LIGHTS -->
    <div class="light-wire">

        <div class="light red"></div>
        <div class="light green"></div>
        <div class="light blue"></div>
        <div class="light gold"></div>

        <div class="light red"></div>
        <div class="light green"></div>
        <div class="light blue"></div>
        <div class="light gold"></div>

        <div class="light red"></div>
        <div class="light green"></div>
        <div class="light blue"></div>
        <div class="light gold"></div>

        <div class="light red"></div>
        <div class="light green"></div>

    </div>

    <!-- TITLE -->
    <div class="header">

        <div class="main-title">
            Merry Christmas!
        </div>

    </div>

    <!-- SANTA -->
    <div class="santa">
        
    </div>

    <!-- MOUNTAINS -->
    <div class="mountains">

        <div class="mountain"></div>
        <div class="mountain"></div>
        <div class="mountain"></div>

    </div>

    <!-- CHRISTMAS TREE -->
    <div class="tree-container" id="tree">

        <div class="tree-glow"></div>

        <div class="tree">

            <div class="tree-star">
                ★
            </div>

            <div class="layer layer1"></div>
            <div class="layer layer2"></div>
            <div class="layer layer3"></div>

            <div class="trunk"></div>

            <!-- TREE LIGHTS -->
            <div class="tree-lights">

                <div class="garland garland1"></div>
                <div class="garland garland2"></div>
                <div class="garland garland3"></div>

                <!-- TOP -->
                <div class="tree-bulb red t1"></div>
                <div class="tree-bulb gold t2"></div>
                <div class="tree-bulb blue t3"></div>
                <div class="tree-bulb green t4"></div>
                <div class="tree-bulb red t5"></div>

                <!-- MIDDLE -->
                <div class="tree-bulb blue m1"></div>
                <div class="tree-bulb red m2"></div>
                <div class="tree-bulb gold m3"></div>
                <div class="tree-bulb green m4"></div>
                <div class="tree-bulb blue m5"></div>

                <!-- BOTTOM -->
                <div class="tree-bulb green b1"></div>
                <div class="tree-bulb gold b2"></div>
                <div class="tree-bulb red b3"></div>
                <div class="tree-bulb blue b4"></div>
                <div class="tree-bulb gold b5"></div>
                <div class="tree-bulb red b6"></div>

            </div>

            <!-- ORNAMENTS -->
            <div class="ornament red-o ornament1"></div>
            <div class="ornament gold-o ornament2"></div>
            <div class="ornament blue-o ornament3"></div>
            <div class="ornament green-o ornament4"></div>
            <div class="ornament red-o ornament5"></div>
            <div class="ornament gold-o ornament6"></div>

        </div>

    </div>

    <!-- GIFTS -->
    <div class="gifts">

        <div class="gift gift1"></div>
        <div class="gift gift2"></div>
        <div class="gift gift3"></div>

    </div>

    <!-- SNOWMAN -->
    <div class="snowman">

        <div class="snow-hat"></div>

        <div class="snow-head">

            <div class="eye left"></div>
            <div class="eye right"></div>

            <div class="snow-nose"></div>

        </div>

        <div class="scarf"></div>

        <div class="snow-body"></div>

    </div>

    <!-- FALLING SNOW -->
    <div class="snow-container" id="snow"></div>

    <!-- GROUND -->
    <div class="ground"></div>


    <!-- GIFT BUTTON -->
    <button class="open-btn" id="openGift">
        🎁 Open Christmas Gift
    </button>

    <!-- CHRISTMAS MUSIC -->
    <audio id="christmasSong" autoplay loop>
        <source src="JingleBells.mp3" type="audio/mpeg">
    </audio>

</div>

<!-- MODAL -->
<div class="modal" id="modal">

    <div class="message-box">

        <h2>
            🎄 Merry Christmas!
        </h2>

        <p>
            May your Christmas be filled with happiness,
            laughter, love, wonderful memories, and plenty
            of magical moments. ✨
        </p>

        <button class="close-btn" id="closeModal">
            Close
        </button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
